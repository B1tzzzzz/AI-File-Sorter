[project]
name = "venv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "B1tzzzzz", email = "matew651@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-supervisor>=0.0.31",
]

[project.scripts]
venv = "venv:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
]
